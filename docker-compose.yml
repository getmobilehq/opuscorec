version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: opuscore-postgres
    environment:
      POSTGRES_USER: opuscore
      POSTGRES_PASSWORD: opuscore
      POSTGRES_DB: opuscore
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U opuscore']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: opuscore-redis
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  # Uncomment when ready to run the API
  # api:
  #   build:
  #     context: .
  #     dockerfile: apps/api/Dockerfile
  #   container_name: opuscore-api
  #   environment:
  #     DATABASE_URL: postgresql://opuscore:opuscore@postgres:5432/opuscore?schema=public
  #     REDIS_URL: redis://redis:6379
  #     JWT_SECRET: opuscore-dev-secret
  #     NODE_ENV: development
  #   ports:
  #     - '3000:3000'
  #   depends_on:
  #     - postgres
  #     - redis
  #   volumes:
  #     - ./apps/api:/app/apps/api
  #     - ./packages:/app/packages
  #     - /app/node_modules

volumes:
  postgres_data:
  redis_data:
